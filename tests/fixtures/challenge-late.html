<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
</head>
<body>
  <h1>Sign in</h1>
  <form id="f">
    <label>Email <input type="email" id="user" autocomplete="username"></label>
    <label>Password <input type="password" id="pass"></label>
    <button type="submit">Log in</button>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", function (e) {
      e.preventDefault();
      location.hash = "ok";
    });
    setTimeout(function () {
      var f = document.createElement("iframe");
      f.id = "late";
      f.title = "Widget";
      f.src = "turnstile-frame.html";
      document.body.appendChild(f);
    }, 250);
  </script>
</body>
</html>
