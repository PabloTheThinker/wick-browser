<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Two-step login</title>
</head>
<body>
  <h1>Sign in</h1>
  <form id="f">
    <label>Email <input id="user" name="email" type="email" autocomplete="username"></label>
    <div id="pwwrap" hidden>
      <label>Password <input id="pass" name="password" type="password"></label>
      <button type="submit" id="go">Log in</button>
    </div>
    <button type="button" id="continue">Continue</button>
  </form>
  <p id="out"></p>
  <script>
    document.getElementById("continue").addEventListener("click", () => {
      document.getElementById("pwwrap").hidden = false;
      document.getElementById("continue").hidden = true;
    });
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault();
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      if (u && p) {
        location.hash = "ok";
        document.getElementById("out").textContent = "welcome";
      }
    });
  </script>
</body>
</html>
