# Hermes Agent ↔ Wick MCP (copy into ~/.hermes/config.yaml under mcp_servers).
# First tool call: skill. Then snap (omit url after act). Examples stay on example.com.
# Login/passkey need a separate full-act process plus wick approve if required.
mcp_servers:
  wick:
    command: wick
    args: [mcp]
    env:
      WICK_PROFILE: safe-act
      WICK_SNAP_PROFILE: default
      WICK_ALLOW_HOSTS: example.com
      # Desktop / Hermes computer-use may click challenges; vault login still blocked.
      WICK_CHALLENGE_COMPUTER_USE: "1"
    timeout: 120
